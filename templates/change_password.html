{% extends "base.html" %}
{% block content %}
<div class="section-head">
<h2>Change Password</h2>
<a href="{{ url_for('profile') }}">Back</a>
</div>
<div class="panel">
<form method="POST">
<div class="field">
<label>Current Password</label>
<input type="password" name="current_password" required autocomplete="current-password">
</div>
<div class="field">
<label>New Password</label>
<input type="password" name="new_password" minlength="6" required autocomplete="new-password">
</div>
<div class="field">
<label>Confirm New Password</label>
<input type="password" name="confirm_password" minlength="6" required autocomplete="new-password">
</div>
<button class="btn full" type="submit">Change Password</button>
</form>
</div>
{% endblock %}
